[versions]
jdbi = "3.49.2"
sqllite = "3.41.2.2"
okhttp = "5.3.2"
lombok = "1.18.42"
hikari = "7.0.2"
mysql = "8.4.0"
gson = "2.13.2"
slf4j = "2.0.1"
log4j = "2.25.3"

[libraries]
jdbi-core = { group = "org.jdbi", name = "jdbi3-core", version.ref = "jdbi" }
jdbi-sqlobject = { group = "org.jdbi", name = "jdbi3-sqlobject", version.ref = "jdbi" }
sqllite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqllite" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
hikari = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
mysql = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mysql" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
slf4j = { group = "org.slf4j", name = "slf4j-log4j12", version.ref = "slf4j" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }